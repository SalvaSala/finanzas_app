# Comprobaciones de calidad en cada cambio: lint, tipos y tests.
#
# Complementa a build.yml (que solo construye los instalables al publicar una
# release). Aquí se vigila que la rama principal no acumule deuda: formato,
# tipado, tests de backend y frontend, y la sincronía de los tipos de la API.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend (lint, tipos, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Se revisa también ../packaging: desktop.py es el punto de entrada de la app
      # de escritorio y hasta ahora era el único código que llegaba al usuario final
      # sin que nada lo comprobara —ni tests, ni linter, ni tipos—, así que una
      # errata ahí solo se descubría construyendo el instalable y viendo que no abre.
      # scripts/ queda fuera a propósito: son utilidades de desarrollo que no se
      # empaquetan, y hoy acumulan 53 avisos de estilo que no aportan nada arreglar.
      - name: Ruff (lint)
        run: uv run ruff check . ../packaging

      # --config explícito: al recibir dos rutas, black busca la configuración en el
      # ancestro común (la raíz del repo, que no tiene pyproject.toml) y se cae a sus
      # 88 columnas por defecto en vez de las 100 nuestras. Sin esto, la CI pediría
      # reformatear 49 ficheros que están perfectamente. ruff no tiene ese problema.
      - name: Black (formato)
        run: uv run black --check --config pyproject.toml . ../packaging

      - name: Mypy (tipos)
        run: uv run mypy . ../packaging

      - name: Pytest
        run: uv run pytest

  frontend:
    name: Frontend (lint, tipos, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Vitest
        run: npm run test:run

  api-types:
    name: Tipos del frontend en sincronía con la API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Volcar el esquema OpenAPI
        working-directory: backend
        run: |
          uv run python -c "import json; from app.main import app; print(json.dumps(app.openapi()))" > "$RUNNER_TEMP/openapi.json"

      - name: Regenerar los tipos y comparar
        working-directory: frontend
        run: |
          npx --yes openapi-typescript@7 "$RUNNER_TEMP/openapi.json" -o "$RUNNER_TEMP/schema.d.ts"
          if ! diff -u src/api/schema.d.ts "$RUNNER_TEMP/schema.d.ts"; then
            echo ""
            echo "::error::Los tipos del frontend no coinciden con el esquema de la API."
            echo "Arranca el backend y ejecuta 'npm run gen:api' en frontend/, luego commitea src/api/schema.d.ts."
            exit 1
          fi
