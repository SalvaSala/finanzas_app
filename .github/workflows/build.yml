# Construye los instalables de FinApp en Windows y Linux automáticamente.
#
# Se dispara al publicar una "Release" en GitHub (o manualmente desde la pestaña
# Actions). GitHub levanta una máquina de cada sistema, construye el instalable y
# lo adjunta como artefacto descargable. Así no necesitas tener ambas máquinas.

name: Build desktop installers

on:
  release:
    types: [published]
  workflow_dispatch: {}   # permite lanzarlo a mano

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend deps
        working-directory: backend
        run: |
          uv sync
          uv pip install pyinstaller pywebview

      - name: Package with PyInstaller
        working-directory: backend
        run: uv run pyinstaller ../packaging/finapp.spec --distpath ../dist --workpath ../build --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinApp-${{ matrix.os }}
          path: dist/FinApp
