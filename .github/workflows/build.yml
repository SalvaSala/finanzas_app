# Construye los instalables de FinApp en Windows y Linux automáticamente.
#
# Se dispara al publicar una "Release" en GitHub (o manualmente desde la pestaña
# Actions). GitHub levanta una máquina de cada sistema, construye el instalable y
# lo adjunta como artefacto descargable. Así no necesitas tener ambas máquinas.

name: Build desktop installers

on:
  release:
    types: [published]
  workflow_dispatch: {}   # permite lanzarlo a mano

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # PyGObject (el backend GTK de pywebview en Linux) se compila contra estas
      # cabeceras, y WebKit2 necesita su typelib en tiempo de ejecución. Sin ellas
      # el binario se genera igual, pero la ventana nunca abre.
      - name: Install GTK/WebKit system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository1.0-dev \
            libcairo2-dev \
            gir1.2-gtk-3.0
          # WebKit2 4.1 (Ubuntu 24.04+) o 4.0 (imágenes más antiguas): el runner solo
          # trae una de las dos, y finapp.spec empaqueta la que encuentre.
          sudo apt-get install -y --no-install-recommends gir1.2-webkit2-4.1 \
            || sudo apt-get install -y --no-install-recommends gir1.2-webkit2-4.0

      - name: Install backend deps
        working-directory: backend
        # El grupo `packaging` trae PyInstaller y, solo en Linux, PyGObject.
        run: uv sync --group packaging

      - name: Package with PyInstaller
        working-directory: backend
        run: uv run pyinstaller ../packaging/finapp.spec --distpath ../dist --workpath ../build --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinApp-${{ matrix.os }}
          path: dist/FinApp
