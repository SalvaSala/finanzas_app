[project]
name = "finapp-backend"
version = "0.1.0"
description = "FinApp backend — API REST de finanzas personales (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.9",
    "fpdf2>=2.8.7",
    "pywebview>=5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "pytest>=8.3",
    "httpx>=0.28",
]

# Proyecto-aplicación: no se publica como paquete instalable.
# `uv run uvicorn app.main:app` funciona porque el cwd es backend/ y `app/` es importable.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
# Las migraciones de Alembic son autogeneradas: no las lintamos.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI usa `Depends(...)` como valor por defecto de los parámetros (idiom).
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
# Las migraciones autogeneradas de Alembic no se comprueban con tipos.
exclude = ['alembic/versions/']

[tool.pytest.ini_options]
testpaths = ["tests"]
